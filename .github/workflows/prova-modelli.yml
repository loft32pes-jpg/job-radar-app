name: Prova GitHub Models
# Verifica quali modelli AI gratuiti di GitHub Models si possono usare dalle ricerche (solo nomi e risposte di prova)
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  prova:
    if: github.repository == 'loft32pes-jpg/job-radar-app'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Catalogo e prova
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          tok = os.environ["GH_TOKEN"]
          def get(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=40); return r.status, r.read().decode(), dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300], dict(e.headers)
          st, raw, _ = get("https://models.github.ai/catalog/models")
          print("catalogo", st)
          ids = []
          try:
              for m in json.loads(raw):
                  ids.append(m["id"]); print(" ", m["id"], m.get("rate_limit_tier"))
          except Exception as e:
              print("catalogo non JSON", raw[:200])
          cands = ids or ["openai/gpt-4.1-mini", "openai/gpt-4o-mini", "openai/gpt-4.1", "openai/gpt-5-mini", "openai/gpt-5-nano",
                          "meta/Llama-4-Scout-17B-16E-Instruct", "deepseek/DeepSeek-V3-0324", "xai/grok-3-mini", "mistral-ai/mistral-small-2503"]
          for mid in [i for i in cands if any(k in i.lower() for k in ("gpt-4.1", "gpt-4o-mini", "gpt-5", "llama-4", "deepseek", "grok", "mistral"))][:10]:
              st, raw, h = get("https://models.github.ai/inference/chat/completions",
                               {"model": mid, "messages": [{"role": "user", "content": "Rispondi solo con la parola: ok"}], "max_tokens": 5})
              lim = {k: v for k, v in h.items() if "ratelimit" in k.lower()}
              print("prova", mid, st, raw[:120].replace("\n", " "), lim)
          PY
